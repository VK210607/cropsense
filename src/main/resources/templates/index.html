<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CropSense — Smart Crop Advisor</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f7e6; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 500px; }
        h1 { color: #2d6a4f; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { margin-top: 25px; width: 100%; padding: 12px; background: #2d6a4f; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background: #1b4332; }
        p.hint { color: #888; font-size: 12px; margin-top: 3px; }
    </style>
</head>
<body>
<div class="card">
    <h1>🌱 CropSense</h1>
    <p style="text-align:center; color:#555;">Enter your soil & weather conditions below</p>
    <form method="post" action="/predict">
        <label>Nitrogen (N) kg/ha</label>
        <input type="number" step="0.1" name="nitrogen" value="90" required>

        <label>Phosphorus (P) kg/ha</label>
        <input type="number" step="0.1" name="phosphorus" value="42" required>

        <label>Potassium (K) kg/ha</label>
        <input type="number" step="0.1" name="potassium" value="43" required>

        <label>Temperature (°C)</label>
        <input type="number" step="0.1" name="temperature" value="20.9" required>

        <label>Humidity (%)</label>
        <input type="number" step="0.1" name="humidity" value="82" required>

        <label>Soil pH</label>
        <input type="number" step="0.01" name="ph" value="6.5" required>

        <label>Rainfall (mm)</label>
        <input type="number" step="0.1" name="rainfall" value="202" required>

        <button type="submit">🔍 Predict Best Crop</button>
    </form>
</div>
</body>
</html>
